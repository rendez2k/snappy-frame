[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# PWA: make sure the manifest and service worker are served correctly, or
# Chrome silently refuses to offer "Install app".
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# Share links: /s/<token> serves the image bytes for a public share token.
# A rewrite (200), not a redirect, so the clean URL is what people see and
# what chat clients unfurl.
[[redirects]]
  from = "/s/*"
  to = "/.netlify/functions/inbox?op=view&token=:splat"
  status = 200
