<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snappy Frame — Inbox</title>
<meta name="description" content="Your private Snappy Frame inbox — captures sent from the desktop app, extension or phone, ready to grab raw or beautify.">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d5efc'/%3E%3Cstop offset='1' stop-color='%23c05bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='9' y='10' width='14' height='12' rx='2.5' fill='none' stroke='white' stroke-width='2.2'/%3E%3C/svg%3E">
<style>
  :root{--bg:#f7f8fb;--card:#fff;--ink:#1b1e28;--mut:#6b7180;--line:#e6e8ef;--acc:#6d5efc;--acc2:#c05bff;--danger:#e5484d;}
  @media (prefers-color-scheme:dark){:root{--bg:#0e0f14;--card:#171a22;--ink:#e7e9ef;--mut:#9aa0b0;--line:#262b38;}}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
    padding:max(18px,env(safe-area-inset-top)) 22px 60px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1000px;margin:0 auto;}
  header{display:flex;align-items:center;gap:11px;padding:6px 0 4px;}
  .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(150deg,var(--acc),var(--acc2));display:grid;place-items:center;flex:0 0 auto;}
  h1{font-size:19px;margin:0;letter-spacing:-.01em;}
  .sub{color:var(--mut);font-size:13px;margin:2px 0 0;}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0;}
  .code{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;}
  .code input{border:0;background:transparent;color:var(--ink);font:inherit;width:210px;letter-spacing:.02em;}
  button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 13px;cursor:pointer;}
  button.p{background:linear-gradient(120deg,var(--acc),var(--acc2));color:#fff;border:0;}
  button.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line));}
  button:disabled{opacity:.5;cursor:default;}
  .privacy{background:color-mix(in srgb,var(--acc) 8%,transparent);border:1px solid color-mix(in srgb,var(--acc) 25%,var(--line));color:var(--mut);
    border-radius:10px;padding:10px 13px;font-size:12.5px;margin:0 0 18px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
  .thumb{aspect-ratio:16/10;background:repeating-conic-gradient(#0000 0% 25%,color-mix(in srgb,var(--mut) 12%,transparent) 0% 50%) 0/18px 18px;
    display:grid;place-items:center;overflow:hidden;}
  .thumb img{width:100%;height:100%;object-fit:contain;display:block;}
  .meta{display:flex;justify-content:space-between;align-items:center;padding:7px 11px;font-size:11.5px;color:var(--mut);}
  .src{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);border-radius:999px;padding:2px 8px;font-weight:700;}
  .acts{display:flex;gap:6px;padding:0 9px 10px;flex-wrap:wrap;}
  .acts button{padding:6px 9px;font-size:12px;border-radius:8px;}
  .empty{text-align:center;color:var(--mut);padding:60px 20px;}
  .empty .big{font-size:40px;margin-bottom:8px;}
  .setup{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:520px;margin:20px auto;text-align:center;}
  .setup code{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px 7px;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#12141c;color:#fff;padding:9px 15px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;}
  .toast.on{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="13" rx="2.5"/><path d="M4 10h16"/></svg></span>
    <div><h1>Inbox</h1><p class="sub">Captures sent here from the desktop app, extension or phone.</p></div>
  </header>

  <div class="privacy">🔒 <b>Opt-in.</b> Items shown here were uploaded and live on the server until you delete them or they expire (14 days). Everything else in Snappy Frame stays on your device. Your inbox code is a secret — anyone with it can see these.</div>

  <div class="bar">
    <div class="code"><span>Code</span><input id="code" spellcheck="false" placeholder="snap_…"><button id="copyCode" title="Copy code">Copy</button></div>
    <button id="save">Use code</button>
    <button id="newCode">New inbox</button>
    <span style="flex:1"></span>
    <button id="refresh">Refresh</button>
    <button id="clear" class="danger">Clear inbox</button>
  </div>

  <div id="stage"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = "/.netlify/functions/inbox";
const $ = id => document.getElementById(id);
const toast = (m)=>{ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1800); };
const LS = 'snappy_inbox_code';
let code = '', items = [], latest = 0, timer = null, editorWin = null;

function genCode(){ const a=new Uint8Array(18); crypto.getRandomValues(a);
  return 'snap_'+Array.from(a,b=>b.toString(36).padStart(2,'0')).join('').slice(0,24); }
function validCode(c){ return /^snap_[A-Za-z0-9]{16,64}$/.test(c); }

function boot(){
  const hash = new URLSearchParams(location.hash.slice(1)).get('code');
  code = hash || localStorage.getItem(LS) || '';
  if(!validCode(code)){ code = genCode(); localStorage.setItem(LS, code); }
  else localStorage.setItem(LS, code);
  $('code').value = code;
  startPolling();
}
function setCode(c){ if(!validCode(c)){ toast('That code looks invalid'); return; } code=c; localStorage.setItem(LS,code); $('code').value=code; items=[]; latest=0; render(); startPolling(); }

async function poll(){
  if(!validCode(code)) return;
  try{
    const r = await fetch(`${API}?op=list&code=${encodeURIComponent(code)}&since=${latest}`);
    const j = await r.json();
    if(j.items && j.items.length){
      for(const it of j.items){ if(!items.find(x=>x.id===it.id)) items.unshift(it); }
      items.sort((a,b)=>b.createdAt-a.createdAt);
      latest = Math.max(latest, ...items.map(i=>i.createdAt));
      render();
    } else if(j.count!==undefined && j.count!==items.length && latest===0){
      render();
    }
  }catch(e){ /* offline / not deployed yet */ }
}
function startPolling(){ clearInterval(timer); poll(); timer=setInterval(poll,4000); }

function imgUrl(id){ return `${API}?op=get&code=${encodeURIComponent(code)}&id=${encodeURIComponent(id)}`; }
function when(ts){ const s=(Date.now()-ts)/1000; if(s<60)return'just now'; if(s<3600)return Math.floor(s/60)+'m ago'; if(s<86400)return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; }

function render(){
  const st=$('stage');
  if(!items.length){ st.innerHTML=`<div class="empty"><div class="big">📥</div><p>No snaps yet.<br>Send one from Snappy Snap (desktop) or the extension using code <b>${code}</b>.</p></div>`; return; }
  st.innerHTML = `<div class="grid">`+items.map(it=>`
    <div class="item" data-id="${it.id}">
      <div class="thumb"><img loading="lazy" src="${imgUrl(it.id)}" alt=""></div>
      <div class="meta"><span class="src">${it.source||'sent'}</span><span>${it.w&&it.h?it.w+'×'+it.h+' · ':''}${when(it.createdAt)}</span></div>
      <div class="acts">
        <button data-a="beautify" class="p">Beautify</button>
        <button data-a="raw">Raw</button>
        <button data-a="copy">Copy</button>
        <button data-a="del" class="danger">Delete</button>
      </div>
    </div>`).join('')+`</div>`;
}

async function blobOf(id){ const r=await fetch(imgUrl(id)); return await r.blob(); }

async function doAction(id, a){
  if(a==='raw'){ const b=await blobOf(id); const u=URL.createObjectURL(b); const el=document.createElement('a'); el.href=u; el.download=`snap-${id.slice(0,8)}.png`; el.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); toast('Downloaded raw'); return; }
  if(a==='copy'){ try{ const b=await blobOf(id); await navigator.clipboard.write([new ClipboardItem({'image/png':b})]); toast('Copied'); }catch(e){ toast('Copy not supported here'); } return; }
  if(a==='del'){ items=items.filter(x=>x.id!==id); render(); try{ await fetch(`${API}?op=del`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,id})}); }catch(e){} toast('Deleted'); return; }
  if(a==='beautify'){
    const b=await blobOf(id); const dataUrl=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b);});
    // Open the editor (same origin) and hand the image over via postMessage.
    const w=window.open('/','snappy_editor'); if(!w){ toast('Allow pop-ups to beautify'); return; }
    let n=0; const send=()=>{ if(n++>8) return; try{ w.postMessage({type:'snappy-frame-image',dataUrl}, location.origin); }catch(e){} setTimeout(send,700); };
    setTimeout(send,900); toast('Opening editor…');
  }
}

$('stage').addEventListener('click',e=>{ const btn=e.target.closest('button[data-a]'); if(!btn) return; const item=btn.closest('.item'); doAction(item.dataset.id, btn.dataset.a); });
$('save').onclick=()=>setCode($('code').value.trim());
$('code').addEventListener('keydown',e=>{ if(e.key==='Enter') setCode($('code').value.trim()); });
$('newCode').onclick=()=>{ if(confirm('Start a fresh inbox? Your current code will be replaced (old items stay under the old code).')){ setCode(genCode()); toast('New inbox created'); } };
$('copyCode').onclick=async()=>{ try{ await navigator.clipboard.writeText(code); toast('Code copied'); }catch(e){ $('code').select(); } };
$('refresh').onclick=()=>poll();
$('clear').onclick=async()=>{ if(!items.length){ toast('Already empty'); return; } if(confirm('Delete all items in this inbox?')){ items=[]; render(); try{ await fetch(`${API}?op=clear`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})}); }catch(e){} toast('Inbox cleared'); } };

boot();
</script>
</body>
</html>
