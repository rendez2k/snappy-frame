<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{--bg:#1b1e28;--bar:#232733;--line:#333949;--ink:#e7e9ef;--mut:#9aa0b0;--acc:#6d5efc;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;overflow:hidden;}
  #bar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bar);
    border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .grp{display:flex;align-items:center;gap:4px;}
  .sep{width:1px;height:24px;background:var(--line);margin:0 4px;}
  button.t{width:34px;height:32px;border:1px solid var(--line);background:#2b3040;color:var(--ink);
    border-radius:8px;cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;}
  button.t:hover{border-color:#48506a;}
  button.t.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 26%,#2b3040);}
  .sw{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0;}
  .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc);}
  .spacer{flex:1;}
  button.act{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--line);
    background:#2b3040;color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;}
  button.act:hover{border-color:#48506a;}
  button.act.primary{background:var(--acc);border-color:var(--acc);color:#fff;}
  #stage{position:absolute;top:49px;left:0;right:0;bottom:0;display:flex;align-items:center;
    justify-content:center;overflow:hidden;padding:12px;}
  #wrap{position:relative;line-height:0;}
  canvas{max-width:100%;max-height:100%;box-shadow:0 10px 40px rgba(0,0,0,.5);border-radius:4px;cursor:crosshair;}
  canvas.mv{cursor:move;}
  #tin{position:absolute;display:none;z-index:5;background:transparent;border:1px dashed var(--acc);
    color:#000;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;
    padding:2px 4px;outline:none;min-width:20px;white-space:pre;}
  .hint{font-size:11.5px;color:var(--mut);margin-left:4px;}
  /* The custom swatch is a real <input type=color> hidden behind a round chip,
     so the OS colour picker (wheel, hex, eyedropper) opens on click. */
  #customSw{position:relative;overflow:hidden;display:inline-block;
    background:conic-gradient(#ff3b30,#ffcc00,#34c759,#0a84ff,#af52de,#ff3b30);}
  #customIn{position:absolute;inset:-4px;width:200%;height:200%;border:0;padding:0;cursor:pointer;opacity:0;}
  canvas.pick{cursor:crosshair;}
</style>
</head>
<body>
  <div id="bar">
    <div class="grp" id="tools">
      <button class="t" data-tool="pencil" title="Pencil — freehand (P)">✎</button>
      <button class="t" data-tool="line" title="Line (L) — Shift snaps to 45°">╱</button>
      <button class="t on" data-tool="arrow" title="Arrow (A) — Shift snaps to 45°">↗</button>
      <button class="t" data-tool="box" title="Box (B) — Shift for a square">▢</button>
      <button class="t" data-tool="fill" title="Filled box (F)">■</button>
      <button class="t" data-tool="ellipse" title="Ellipse (O) — Shift for a circle">◯</button>
      <button class="t" data-tool="highlight" title="Highlighter (H)">🖍️</button>
      <button class="t" data-tool="text" title="Text (T)">T</button>
      <button class="t" data-tool="counter" title="Numbered step (N) — click to drop 1, 2, 3…">①</button>
      <button class="t" data-tool="pixelate" title="Pixelate (M)">▦</button>
      <button class="t" data-tool="blur" title="Blur / redact (X)">🔲</button>
      <button class="t" data-tool="move" title="Move / select (V) — drag to move, Delete to remove, arrows to nudge">✥</button>
    </div>
    <div class="sep"></div>
    <div class="grp" id="colours"></div>
    <button class="t" id="eyedrop" title="Pick a colour from the screenshot (I)">⊙</button>
    <label class="sw" id="customSw" title="Any colour">
      <input type="color" id="customIn" value="#6d5efc">
    </label>
    <div class="sep"></div>
    <div class="grp" id="sizes">
      <button class="t" data-size="s" title="Thin">·</button>
      <button class="t on" data-size="m" title="Medium">••</button>
      <button class="t" data-size="l" title="Thick">●</button>
    </div>
    <div class="sep"></div>
    <button class="t" id="undo" title="Undo (Ctrl+Z)">↶</button>
    <button class="t" id="redo" title="Redo (Ctrl+Y)">↷</button>
    <span class="hint">Esc cancel</span>
    <div class="spacer"></div>
    <button class="act" id="pin" title="Pin the marked-up image on top of everything">📌 Pin</button>
    <button class="act" id="share" title="Upload and copy a 7-day link">🔗 Link</button>
    <button class="act" id="beautify" title="Open in Snappy Frame">✨ Beautify</button>
    <button class="act primary" id="done" title="Copy &amp; save (Enter)">✓ Copy &amp; Done</button>
  </div>
  <div id="stage"><div id="wrap"><canvas id="c"></canvas><input id="tin" spellcheck="false"></div></div>

<script>
  // Surface any failure both on-screen (the toolbar hint turns red) and to the
  // main process (a Windows notification), so a silent throw can't hide.
  function report(msg){
    try{ if(window.snap && window.snap.annotateReport) window.snap.annotateReport(String(msg)); }catch(_){}
    const h = document.querySelector('.hint'); if(h){ h.textContent = String(msg).slice(0, 110); h.style.color = '#ff6b6b'; }
  }
  window.addEventListener('error', (e) => report('Error: ' + (e.message || (e.error && e.error.message) || 'unknown')));
  window.addEventListener('unhandledrejection', (e) => report('Error: ' + (e.reason && e.reason.message || e.reason)));

(async () => {
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d'), tin = $('tin'), wrap = $('wrap');
  const d = await window.snap.getAnnotate();
  if(!d){ window.snap.annotateCancel(); return; }

  const base = new Image();
  base.onload = () => { cv.width = d.w; cv.height = d.h; redraw(); };
  base.src = d.dataUrl;

  const COLOURS = ['#ff3b30','#ffcc00','#34c759','#0a84ff','#ffffff','#111111'];
  const SIZES = { s: 3, m: 6, l: 11 };
  let tool = 'arrow', colour = COLOURS[0], sizeKey = 'm';
  const shapes = [];                 // committed annotations, in draw order
  const redoStack = [];              // shapes undone, newest last; cleared by any new shape
  let draft = null;                  // shape being dragged
  let selected = null;               // shape picked with the move tool (or just placed)
  let moving = null;                 // { s, dx, dy } while dragging a selected shape

  // build colour swatches
  const cwrap = $('colours');
  COLOURS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'sw' + (i === 0 ? ' on' : ''); b.style.background = c; b.dataset.colour = c;
    b.onclick = () => setColour(c);
    cwrap.appendChild(b);
  });
  function setColour(c){
    colour = c;
    [...cwrap.children].forEach(x => x.classList.toggle('on', x.dataset.colour === c));
    const sw = $('customSw'); const mine = !COLOURS.includes(c);
    sw.classList.toggle('on', mine);
    if(mine){ sw.style.background = c; $('customIn').value = c; }
    else sw.style.background = '';
  }
  $('customIn').addEventListener('input', e => setColour(e.target.value));
  // Eyedropper: one-shot. Click a pixel, take its colour, go back to the tool
  // you were using — the same shape as every other picker.
  let picking = null;
  function startPick(){ if(picking) return; picking = tool; cv.classList.add('pick'); $('eyedrop').classList.add('on'); }
  function stopPick(){ picking = null; cv.classList.remove('pick'); $('eyedrop').classList.remove('on'); }
  $('eyedrop').onclick = () => picking ? stopPick() : startPick();
  function pickAt(p){
    // Sample the BASE image, not the canvas: picking off your own annotations
    // is never what you meant, and the base is what the eye is looking at.
    const t = document.createElement('canvas'); t.width = 1; t.height = 1;
    const g = t.getContext('2d', { willReadFrequently: true });
    g.drawImage(base, Math.max(0, Math.min(cv.width - 1, p.x | 0)), Math.max(0, Math.min(cv.height - 1, p.y | 0)), 1, 1, 0, 0, 1, 1);
    const d = g.getImageData(0, 0, 1, 1).data;
    setColour('#' + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, '0')).join(''));
    stopPick();
  }
  function setTool(t){ tool = t; [...$('tools').children].forEach(b => b.classList.toggle('on', b.dataset.tool === t)); cv.classList.toggle('mv', t === 'move'); if(t !== 'move') selected = null; redraw(); }
  [...$('tools').children].forEach(b => b.onclick = () => setTool(b.dataset.tool));
  [...$('sizes').children].forEach(b => b.onclick = () => { sizeKey = b.dataset.size;
    [...$('sizes').children].forEach(x => x.classList.toggle('on', x === b)); });

  // ---- drawing -----------------------------------------------------------
  function lineW(s){ return SIZES[s.size || sizeKey] || 6; }
  function rectOf(s){ return { x: Math.min(s.x1, s.x2), y: Math.min(s.y1, s.y2), w: Math.abs(s.x2 - s.x1), h: Math.abs(s.y2 - s.y1) }; }
  // Counters are numbered by their order among counters, so deleting step 2
  // turns 3 into 2 — you never have to re-place a sequence.
  function counterNo(s){ let n = 0; for(const t of shapes){ if(t.tool === 'counter'){ n++; if(t === s) return n; } } return n + 1; }
  function counterR(s){ return Math.round(lineW(s) * 2.2 + 8); }
  function drawShape(s){
    ctx.save();
    if(s.tool === 'pixelate'){
      const r = rectOf(s);
      if(r.w > 1 && r.h > 1){
        // Mosaic: shrink the region to coarse cells and blow it back up with
        // smoothing off — the classic redaction look, and unlike a blur it
        // can't be "un-blurred" by deconvolution.
        // Cell size follows the thickness buttons, so · is a fine mosaic and ●
        // a chunky one — the same control that sets line weight everywhere else.
        const cell = Math.max(8, Math.round(lineW(s) * 2));
        const cw = Math.max(1, Math.round(r.w / cell)), ch = Math.max(1, Math.round(r.h / cell));
        const t = document.createElement('canvas'); t.width = cw; t.height = ch;
        const tg = t.getContext('2d'); tg.imageSmoothingEnabled = true;
        tg.drawImage(base, r.x, r.y, r.w, r.h, 0, 0, cw, ch);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(t, 0, 0, cw, ch, r.x, r.y, r.w, r.h);
      }
      ctx.restore(); return;
    }
    if(s.tool === 'blur'){
      const x = Math.min(s.x1, s.x2), y = Math.min(s.y1, s.y2), w = Math.abs(s.x2 - s.x1), h = Math.abs(s.y2 - s.y1);
      if(w > 1 && h > 1){
        ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
        // draw the base image heavily blurred, only within the clip → pixel-free redaction
        const r = Math.max(6, Math.round(Math.min(w, h) / 6));
        ctx.filter = 'blur(' + r + 'px)';
        ctx.drawImage(base, 0, 0, cv.width, cv.height);
        ctx.filter = 'none';
      }
      ctx.restore(); return;
    }
    ctx.strokeStyle = s.colour; ctx.fillStyle = s.colour; ctx.lineWidth = lineW(s);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if(s.tool === 'pencil'){
      const pts = s.pts; if(pts.length){
        ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
        for(let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        if(pts.length === 1) ctx.lineTo(pts[0].x + 0.01, pts[0].y);
        ctx.stroke();
      }
    } else if(s.tool === 'line'){
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    } else if(s.tool === 'fill'){
      const r = rectOf(s); ctx.fillRect(r.x, r.y, r.w, r.h);
    } else if(s.tool === 'counter'){
      const R = counterR(s), n = String(counterNo(s));
      ctx.beginPath(); ctx.arc(s.x, s.y, R, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.stroke();
      ctx.fillStyle = (s.colour === '#ffffff' || s.colour === '#ffcc00') ? '#111111' : '#ffffff';
      ctx.font = '700 ' + Math.round(R * 1.15) + 'px -apple-system,"Segoe UI",Roboto,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(n, s.x, s.y + R * 0.05);
    } else if(s.tool === 'arrow'){
      const dx = s.x2 - s.x1, dy = s.y2 - s.y1, ang = Math.atan2(dy, dx);
      const len = Math.hypot(dx, dy), head = Math.max(12, lineW(s) * 3.2);
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
      if(len > 4){
        ctx.beginPath(); ctx.moveTo(s.x2, s.y2);
        ctx.lineTo(s.x2 - head * Math.cos(ang - Math.PI / 7), s.y2 - head * Math.sin(ang - Math.PI / 7));
        ctx.lineTo(s.x2 - head * Math.cos(ang + Math.PI / 7), s.y2 - head * Math.sin(ang + Math.PI / 7));
        ctx.closePath(); ctx.fill();
      }
    } else if(s.tool === 'box'){
      ctx.strokeRect(Math.min(s.x1, s.x2), Math.min(s.y1, s.y2), Math.abs(s.x2 - s.x1), Math.abs(s.y2 - s.y1));
    } else if(s.tool === 'ellipse'){
      const cx = (s.x1 + s.x2) / 2, cy = (s.y1 + s.y2) / 2;
      ctx.beginPath(); ctx.ellipse(cx, cy, Math.abs(s.x2 - s.x1) / 2, Math.abs(s.y2 - s.y1) / 2, 0, 0, Math.PI * 2); ctx.stroke();
    } else if(s.tool === 'highlight'){
      ctx.globalAlpha = 0.32; ctx.globalCompositeOperation = 'multiply';
      ctx.fillRect(Math.min(s.x1, s.x2), Math.min(s.y1, s.y2), Math.abs(s.x2 - s.x1), Math.abs(s.y2 - s.y1));
    } else if(s.tool === 'text'){
      ctx.font = '700 ' + s.px + 'px -apple-system,"Segoe UI",Roboto,sans-serif';
      ctx.textBaseline = 'top';
      ctx.lineWidth = Math.max(2, s.px / 8); ctx.strokeStyle = 'rgba(0,0,0,.55)';
      s.text.split('\n').forEach((ln, i) => { const y = s.y + i * s.px * 1.2; ctx.strokeText(ln, s.x, y); ctx.fillText(ln, s.x, y); });
    }
    ctx.restore();
  }
  // ---- select / move -----------------------------------------------------
  function bboxOf(s){
    if(s.tool === 'text'){
      ctx.save(); ctx.font = '700 ' + s.px + 'px -apple-system,"Segoe UI",Roboto,sans-serif';
      const lines = s.text.split('\n');
      const w = Math.max(...lines.map(l => ctx.measureText(l).width));
      ctx.restore();
      return { x: s.x, y: s.y, w, h: lines.length * s.px * 1.2 };
    }
    if(s.tool === 'counter'){ const R = counterR(s); return { x: s.x - R, y: s.y - R, w: R * 2, h: R * 2 }; }
    if(s.tool === 'pencil'){
      let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
      for(const p of s.pts){ x1 = Math.min(x1, p.x); y1 = Math.min(y1, p.y); x2 = Math.max(x2, p.x); y2 = Math.max(y2, p.y); }
      return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
    }
    return rectOf(s);
  }
  function distToSeg(px, py, x1, y1, x2, y2){
    const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
    const t = l2 ? Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / l2)) : 0;
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }
  // Topmost first, so a shape drawn later wins over one underneath it.
  function hitTest(p){
    for(let i = shapes.length - 1; i >= 0; i--){
      const s = shapes[i], pad = 8;
      if(s.tool === 'arrow' || s.tool === 'line'){
        if(distToSeg(p.x, p.y, s.x1, s.y1, s.x2, s.y2) <= Math.max(pad, lineW(s))) return s;
      } else if(s.tool === 'pencil'){
        const tol = Math.max(pad, lineW(s)), q = s.pts;
        for(let k = 1; k < q.length; k++) if(distToSeg(p.x, p.y, q[k-1].x, q[k-1].y, q[k].x, q[k].y) <= tol) return s;
        if(q.length === 1 && Math.hypot(p.x - q[0].x, p.y - q[0].y) <= tol) return s;
      } else {
        const b = bboxOf(s);
        if(p.x >= b.x - pad && p.x <= b.x + b.w + pad && p.y >= b.y - pad && p.y <= b.y + b.h + pad) return s;
      }
    }
    return null;
  }
  function moveShape(s, dx, dy){
    if(s.tool === 'text' || s.tool === 'counter'){ s.x += dx; s.y += dy; }
    else if(s.tool === 'pencil'){ for(const p of s.pts){ p.x += dx; p.y += dy; } }
    else { s.x1 += dx; s.x2 += dx; s.y1 += dy; s.y2 += dy; }
  }
  function commit(s){ shapes.push(s); redoStack.length = 0; selected = s; }
  function drawSelection(s){
    const b = bboxOf(s), pad = 6;
    ctx.save(); ctx.setLineDash([6, 4]); ctx.lineWidth = 2;
    ctx.strokeStyle = '#ffffff'; ctx.strokeRect(b.x - pad, b.y - pad, b.w + pad * 2, b.h + pad * 2);
    ctx.strokeStyle = 'rgba(109,94,252,.95)'; ctx.lineDashOffset = 6; ctx.strokeRect(b.x - pad, b.y - pad, b.w + pad * 2, b.h + pad * 2);
    ctx.restore();
  }
  function redraw(){
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.drawImage(base, 0, 0, cv.width, cv.height);
    for(const s of shapes) drawShape(s);
    if(draft) drawShape(draft);
    // The outline is screen-only: finish() clears `selected` before its own
    // redraw so it can never be baked into the exported image.
    if(selected && shapes.includes(selected)) drawSelection(selected);
  }

  // ---- pointer → canvas pixel coords -------------------------------------
  function toCanvas(e){
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (cv.width / r.width), y: (e.clientY - r.top) * (cv.height / r.height) };
  }
  let drawing = false;
  cv.addEventListener('mousedown', (e) => {
    if(e.button !== 0) return;
    if(tin.style.display === 'block'){ commitText(); return; }
    const p = toCanvas(e);
    if(picking){ pickAt(p); return; }
    if(tool === 'move'){
      const hit = hitTest(p);
      selected = hit;
      moving = hit ? { s: hit, lx: p.x, ly: p.y } : null;
      redraw(); return;
    }
    // preventDefault stops the browser moving focus to the canvas AFTER this
    // handler returns, which is what stole the first characters of every
    // caption (they reached the document handler and switched tools instead).
    if(tool === 'text'){ e.preventDefault(); startText(p, e); return; }
    if(tool === 'counter'){ commit({ tool, colour, size: sizeKey, x: p.x, y: p.y }); redraw(); return; }
    drawing = true;
    draft = tool === 'pencil' ? { tool, colour, size: sizeKey, pts: [{ x: p.x, y: p.y }] }
                              : { tool, colour, size: sizeKey, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
  });
  // Hold Shift to constrain: arrows and lines snap to 45°, everything else
  // becomes square. Freehand-straight arrows are the usual reason a mark-up
  // looks scruffy.
  function constrain(d, x, y){
    const dx = x - d.x1, dy = y - d.y1;
    if(d.tool === 'arrow' || d.tool === 'line'){
      const len = Math.hypot(dx, dy);
      const a = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4);
      return { x: d.x1 + Math.cos(a) * len, y: d.y1 + Math.sin(a) * len };
    }
    const m = Math.max(Math.abs(dx), Math.abs(dy));
    return { x: d.x1 + Math.sign(dx || 1) * m, y: d.y1 + Math.sign(dy || 1) * m };
  }
  addEventListener('mousemove', (e) => {
    if(moving){
      const p = toCanvas(e);
      moveShape(moving.s, p.x - moving.lx, p.y - moving.ly);
      moving.lx = p.x; moving.ly = p.y; redraw(); return;
    }
    if(!drawing) return;
    const p = toCanvas(e);
    if(draft.tool === 'pencil'){
      const l = draft.pts[draft.pts.length - 1];
      if(Math.hypot(p.x - l.x, p.y - l.y) >= 1.5) draft.pts.push({ x: p.x, y: p.y });   // skip jitter-sized steps
      redraw(); return;
    }
    const q = e.shiftKey ? constrain(draft, p.x, p.y) : p;
    draft.x2 = q.x; draft.y2 = q.y; redraw();
  });
  addEventListener('mouseup', () => {
    if(moving){ moving = null; return; }
    if(!drawing) return; drawing = false;
    if(draft){
      const keep = draft.tool === 'pencil' ? draft.pts.length > 1
                 : (Math.abs(draft.x2 - draft.x1) > 2 || Math.abs(draft.y2 - draft.y1) > 2);
      if(keep) commit(draft);
    }
    draft = null; redraw();
  });

  // Wheel over the canvas steps the thickness, the way every drawing app does —
  // reaching for the toolbar mid-stroke is what makes mark-up feel slow.
  cv.addEventListener('wheel', (e) => {
    e.preventDefault();
    const order = ['s', 'm', 'l'], i = order.indexOf(sizeKey);
    const next = order[Math.max(0, Math.min(order.length - 1, i + (e.deltaY > 0 ? -1 : 1)))];
    if(next !== sizeKey){ sizeKey = next; [...$('sizes').children].forEach(x => x.classList.toggle('on', x.dataset.size === next)); redraw(); }
  }, { passive: false });

  // ---- text tool ---------------------------------------------------------
  let textAt = null;
  function startText(p, e){
    textAt = p;
    const px = Math.round(SIZES[sizeKey] * 4 + 14);      // scale text size to the size buttons
    const r = cv.getBoundingClientRect(), disp = r.width / cv.width;
    tin.style.display = 'block';
    tin.style.left = (e.clientX - wrap.getBoundingClientRect().left) + 'px';
    tin.style.top = (e.clientY - wrap.getBoundingClientRect().top) + 'px';
    tin.style.color = colour; tin.style.fontSize = (px * disp) + 'px';
    tin.value = ''; tin._px = px;
    // Focus NOW, not on a timer: anything typed before focus lands goes to the
    // document handler instead, which eats the first characters AND switches
    // tools behind your back ("Look here" arrived as "here", via the line and
    // ellipse tools). Paired with preventDefault on the mousedown, which stops
    // the browser handing focus back to the canvas a moment later. The timeout
    // stays as a belt-and-braces retry.
    tin.focus(); setTimeout(() => { if(tin.style.display === 'block' && document.activeElement !== tin) tin.focus(); }, 0);
  }
  function commitText(){
    const v = tin.value.replace(/\s+$/, '');
    if(v && textAt){ commit({ tool: 'text', colour, x: textAt.x, y: textAt.y, px: tin._px, text: v }); }
    tin.style.display = 'none'; tin.value = ''; textAt = null; redraw();
  }
  tin.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); commitText(); }
    else if(e.key === 'Escape'){ e.preventDefault(); tin.style.display = 'none'; tin.value = ''; textAt = null; }
    e.stopPropagation();
  });
  tin.addEventListener('blur', () => { if(tin.style.display === 'block') commitText(); });

  // ---- toolbar actions ---------------------------------------------------
  function undo(){ const g = shapes.pop(); if(!g) return; redoStack.push(g); if(g === selected) selected = null; redraw(); }
  function redo(){ const g = redoStack.pop(); if(!g) return; shapes.push(g); selected = g; redraw(); }
  $('undo').onclick = undo; $('redo').onclick = redo;
  function sendDone(payload){
    if(!(window.snap && window.snap.annotateDone)){ report('Bridge missing — reinstall may be incomplete'); return; }
    window.snap.annotateDone(payload);
  }
  function finish(action){
    try{
      if(tin.style.display === 'block') commitText();
      draft = null; selected = null; moving = null; redraw();
      // toBlob → raw bytes is robust on large canvases and avoids a multi-MB
      // base64 string over IPC. Fall back to toDataURL if the blob is null.
      cv.toBlob(async (blob) => {
        try{
          if(blob){ sendDone({ bytes: new Uint8Array(await blob.arrayBuffer()), action }); return; }
          let url = ''; try{ url = cv.toDataURL('image/png'); }catch(_){}
          if(url && url.length > 40){ sendDone({ dataUrl: url, action }); return; }
          report('Export produced an empty image (' + cv.width + '×' + cv.height + ')');
        }catch(err){ report('Export failed: ' + (err && err.message || err)); }
      }, 'image/png');
    }catch(err){ report('Finish failed: ' + (err && err.message || err)); }
  }
  $('done').onclick = () => finish('done');
  $('beautify').onclick = () => finish('beautify');
  $('pin').onclick = () => finish('pin');
  $('share').onclick = () => finish('share');

  // ---- keyboard ----------------------------------------------------------
  addEventListener('keydown', (e) => {
    if(document.activeElement === tin) return;
    if(e.key === 'Escape'){ if(picking){ stopPick(); return; } window.snap.annotateCancel(); return; }
    if(e.key.toLowerCase() === 'i'){ startPick(); return; }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y'){ e.preventDefault(); redo(); return; }
    if(e.key === 'Enter'){ e.preventDefault(); finish('done'); return; }
    if(selected && (e.key === 'Delete' || e.key === 'Backspace')){
      e.preventDefault(); const k = shapes.indexOf(selected); if(k >= 0){ redoStack.push(shapes.splice(k, 1)[0]); } selected = null; redraw(); return;
    }
    if(selected && /^Arrow(Up|Down|Left|Right)$/.test(e.key)){
      e.preventDefault(); const st = e.shiftKey ? 10 : 1;
      moveShape(selected, e.key === 'ArrowLeft' ? -st : e.key === 'ArrowRight' ? st : 0, e.key === 'ArrowUp' ? -st : e.key === 'ArrowDown' ? st : 0);
      redraw(); return;
    }
    const map = { p: 'pencil', l: 'line', a: 'arrow', b: 'box', f: 'fill', o: 'ellipse', h: 'highlight', t: 'text', n: 'counter', m: 'pixelate', x: 'blur', v: 'move' };
    if(map[e.key.toLowerCase()]){ stopPick(); setTool(map[e.key.toLowerCase()]); }
  });
})();
</script>
</body>
</html>
