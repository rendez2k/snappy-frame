<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{--acc:#6d5efc;--ink:#e9ebf2;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;}
  /* The image IS the window: dragging anywhere on it moves the pin. */
  #wrap{position:relative;height:100%;width:100%;border-radius:8px;overflow:hidden;
    box-shadow:0 10px 34px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.14);
    -webkit-app-region:drag;background:#0f1219;}
  #img{width:100%;height:100%;display:block;object-fit:fill;pointer-events:none;}
  #bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:4px;padding:5px 6px;
    background:linear-gradient(180deg,rgba(8,10,16,.86),rgba(8,10,16,0));opacity:0;transition:opacity .12s;}
  #wrap:hover #bar{opacity:1;}
  #bar button{-webkit-app-region:no-drag;border:0;border-radius:6px;background:rgba(30,34,46,.9);
    color:var(--ink);font:600 10.5px/1 inherit;padding:5px 7px;cursor:pointer;}
  #bar button:hover{background:rgba(58,64,86,.95);}
  #bar .sp{flex:1;}
  #scale{font-size:10px;color:#aeb4c6;padding:0 3px;}
  /* A pin is a reference you keep in view; dimming it lets you read what's underneath. */
  body.faded #wrap{opacity:.45;}
</style>
</head>
<body>
  <div id="wrap">
    <img id="img" alt="">
    <div id="bar">
      <button id="copy" title="Copy to clipboard">Copy</button>
      <button id="save" title="Save a PNG">Save</button>
      <button id="share" title="Upload and copy a 7-day share link">Link</button>
      <span class="sp"></span>
      <span id="scale">100%</span>
      <button id="fade" title="Dim so you can read through it (F)">Dim</button>
      <button id="close" title="Close (Esc)">✕</button>
    </div>
  </div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let natW = 0, natH = 0, pct = 100;

  window.snap.pinOnData(d => {
    natW = d.w; natH = d.h; pct = d.pct || 100;
    $('img').src = d.dataUrl;
    $('scale').textContent = pct + '%';
  });
  window.snap.pinOnScale(p => { pct = p; $('scale').textContent = pct + '%'; });
  window.snap.pinReady();

  $('copy').onclick  = () => window.snap.pinCopy();
  $('save').onclick  = () => window.snap.pinSave();
  $('share').onclick = () => window.snap.pinShare();
  $('close').onclick = () => window.snap.pinClose();
  $('fade').onclick  = () => document.body.classList.toggle('faded');

  // Scroll to resize, the way you'd zoom anything else that's pinned.
  addEventListener('wheel', e => {
    e.preventDefault();
    window.snap.pinScale(e.deltaY < 0 ? 10 : -10);
  }, { passive: false });

  addEventListener('keydown', e => {
    if(e.key === 'Escape') window.snap.pinClose();
    else if(e.key === 'f' || e.key === 'F') document.body.classList.toggle('faded');
    else if(e.key === 'c' && (e.ctrlKey || e.metaKey)) window.snap.pinCopy();
    else if(e.key === '+' || e.key === '=') window.snap.pinScale(10);
    else if(e.key === '-') window.snap.pinScale(-10);
    else if(e.key === '0') window.snap.pinScale('reset');
  });
})();
</script>
</body>
</html>
