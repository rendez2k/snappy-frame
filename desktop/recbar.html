<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{--bg:#171a22;--line:#2b3040;--ink:#e7e9ef;--mut:#9aa0b0;--rec:#ff4d4d;}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;}
  #pill{height:100%;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;
    background:var(--bg);border:1px solid var(--line);border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.45);
    -webkit-app-region:drag;}
  #pill button{-webkit-app-region:no-drag;}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 3px rgba(255,77,77,.25);animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.35}}
  #t{font:600 13px/1 ui-monospace,Consolas,monospace;min-width:92px}
  #t small{color:var(--mut);font-weight:500}
  .bar{position:absolute;left:14px;right:14px;bottom:5px;height:2px;border-radius:2px;background:#2b3040;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--rec)}
  button{border:1px solid var(--line);background:#232734;color:var(--ink);border-radius:999px;height:28px;padding:0 12px;
    font:600 12px/1 inherit;cursor:pointer;display:flex;align-items:center;gap:6px}
  button:hover{border-color:#48506a}
  #stop{background:var(--rec);border-color:var(--rec);color:#fff}
  #stop:hover{filter:brightness(1.1)}
  #stop i{width:9px;height:9px;background:#fff;border-radius:2px;display:block}
  #x{width:28px;padding:0;justify-content:center}
  #pill.starting .dot{animation:none;background:var(--mut);box-shadow:none}
</style>
</head>
<body>
  <div id="pill" class="starting" title="Drag to move — this bar is not in the recording">
    <span class="dot"></span>
    <span id="t">Starting…</span>
    <button id="stop" title="Stop and save"><i></i>Stop</button>
    <button id="x" title="Cancel — discard this recording">✕</button>
    <div class="bar"><i id="p"></i></div>
  </div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let max = 20000;
  const fmt = ms => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  window.snap.recbarOnState(st => {
    if(st.max) max = st.max;
    if(st.started) $('pill').classList.remove('starting');
    if(typeof st.ms === 'number'){
      $('t').innerHTML = fmt(st.ms) + ' <small>/ ' + fmt(max) + '</small>';
      $('p').style.width = Math.min(100, st.ms / max * 100) + '%';
    }
  });
  $('stop').onclick = () => window.snap.recbarStop();
  $('x').onclick = () => window.snap.recbarCancel();
  document.addEventListener('keydown', e => { if(e.key === 'Escape') window.snap.recbarCancel(); });
  window.snap.recbarReady();
})();
</script>
</body>
</html>
